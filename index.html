<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHS Kinetic – Timesheet Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=26">
</head>
<body>

<!-- ══════════════════════════════════════════
     LOGIN
══════════════════════════════════════════ -->
<div id="login-page" style="display:flex">

  <!-- Corner tricolour -->
  <svg class="login-corner-stripes" viewBox="0 0 168 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g transform="skewX(-20)">
      <rect x="10" y="2" width="48" height="16" fill="#F04019"/>
      <rect x="64" y="2" width="48" height="16" fill="#0B1F6B"/>
      <rect x="118" y="2" width="48" height="16" fill="#1F9CD8"/>
    </g>
  </svg>

  <!-- Left branding -->
  <div class="login-left">
    <div class="login-photo-bg" aria-hidden="true"></div>
    <div class="login-branding">
      <div class="login-logo-wrap">
        <svg class="bhs-logo bhs-logo-login" viewBox="0 0 240 78" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BHS — A Connected World, Delivered.">
          <text x="0" y="48" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="56" font-weight="900" font-style="italic" letter-spacing="14" fill="#0B1F6B">BHS</text>
          <text x="2" y="70" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-style="italic" font-weight="600" letter-spacing="0.5" fill="#0B1F6B">A Connected World, Delivered.</text>
        </svg>
      </div>
      <h1 class="login-headline">Timesheet<br><span>Management</span></h1>
    </div>
  </div>

  <!-- Right card -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-card-eyebrow">BHS Kinetic Portal</div>
      <h2>Welcome back</h2>
      <p class="login-card-sub">Sign in to your account to continue</p>
      <form id="lform">
        <div class="lf-group">
          <label>Username</label>
          <input type="text" id="lu" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="lf-group">
          <label>Password</label>
          <input type="password" id="lp" placeholder="Enter password" autocomplete="current-password">
        </div>
        <button type="submit" class="login-submit">Sign In →</button>
        <div id="lerr" class="login-error" style="display:none">Invalid username or password.</div>
      </form>
          </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     APP
══════════════════════════════════════════ -->
<div id="app">
  <nav class="topnav">
    <div class="nav-logo">
      <svg class="bhs-logo bhs-logo-nav" viewBox="0 0 240 78" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BHS">
        <g transform="skewX(-20)">
          <rect x="24" y="2" width="56" height="14" fill="#F04019"/>
          <rect x="86" y="2" width="56" height="14" fill="#0B1F6B"/>
          <rect x="148" y="2" width="56" height="14" fill="#1F9CD8"/>
        </g>
        <text x="2" y="72" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-size="56" font-weight="900" font-style="italic" letter-spacing="14" fill="#0B1F6B">BHS</text>
      </svg>
      <span class="nav-buildit">BUILD-IT</span>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
    <div class="nav-right">
      <div class="nav-user-chip">
        <div class="nav-avatar" id="nav-init">–</div>
        <div class="nav-user-info">
          <div class="nav-username" id="nav-name">–</div>
          <div class="nav-role-tag" id="nav-role">–</div>
        </div>
      </div>
      <button class="signout-btn" onclick="logout()">Sign Out</button>
    </div>
  </nav>
  <div class="page-wrap" id="content"></div>
</div>

<!-- Toast stack -->
<div class="toast-stack"></div>

<script src="app.js?v=33"></script>

</body>
</html>
